[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connito-vllm"
version = "0.1.0"
description = "Connito's residual experts as a vLLM plugin, for the prompt validator's answers"
requires-python = ">=3.12"
dependencies = [
    "vllm==0.32.0",
    "transformers==5.18.0",  # the repo's, inside vLLM 0.32's range: the same tokenizer and chat template as HF
    "safetensors",
]

[project.entry-points."vllm.general_plugins"]
connito_residual = "connito_vllm.plugin:register"

[tool.setuptools]
packages = ["connito_vllm"]
